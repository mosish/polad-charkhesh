name: Source quality checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: Full-history secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Checksum-verified Gitleaks (redacted output)
        shell: bash
        run: |
          set -euo pipefail
          folder=$(mktemp -d)
          curl --fail --silent --show-error --location --retry 3 \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "$folder/gitleaks.tar.gz"
          printf '%s  %s\n' 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb "$folder/gitleaks.tar.gz" | sha256sum --check
          tar -xzf "$folder/gitleaks.tar.gz" -C "$folder" gitleaks
          "$folder/gitleaks" git . --log-opts=--all --redact=100
  installer:
    name: Ubuntu installer guards and HTTPS configuration
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Test only inside a disposable Ubuntu container
        run: |
          docker run --rm \
            --mount "type=bind,source=$GITHUB_WORKSPACE,target=/workspace,readonly" \
            -e POLAD_INSTALLER_TEST=1 ubuntu:24.04 bash -ec '
              apt-get update -qq
              apt-get install -y -qq nginx openssl shellcheck >/dev/null
              shellcheck /workspace/deploy/install-ubuntu.sh /workspace/deploy/test-installer.sh /workspace/deploy/encrypted-backup.sh
              bash /workspace/deploy/test-installer.sh
            '
  verify:
    name: Tests, types and isolated production smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.21.0'
      - name: Install package manager
        run: npm install --global pnpm@11.25.0
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Install bounded PDF parser
        run: sudo apt-get update -qq && sudo apt-get install -y qpdf util-linux
      - name: TypeScript
        run: pnpm typecheck
      - name: Dependency security audit
        run: pnpm audit --audit-level=moderate
      - name: Regression tests (disposable databases)
        run: pnpm test
      - name: Production build
        run: pnpm build
      - name: JavaScript bundle budgets
        run: pnpm check:bundles
      - name: Production smoke (disposable database and uploads)
        run: pnpm smoke:production
      - name: Repository lint (required)
        id: lint
        if: always()
        run: pnpm lint
      - name: Explain outstanding release gates
        if: always()
        env:
          LINT_OUTCOME: ${{ steps.lint.outcome }}
        run: |
          echo '## Release readiness' >> "$GITHUB_STEP_SUMMARY"
          echo 'This workflow tests source code; it does not deploy or approve a release.' >> "$GITHUB_STEP_SUMMARY"
          echo "Repository lint outcome: $LINT_OUTCOME. Lint is a required source-quality check." >> "$GITHUB_STEP_SUMMARY"
          echo 'Manufacturer data/media review, full browser/accessibility/security audit, and host/domain/backup verification remain separate launch gates.' >> "$GITHUB_STEP_SUMMARY"
          if [ "$LINT_OUTCOME" != 'success' ]; then
            echo '::error::Repository lint is not clean. The source-quality gate failed; see the lint step.'
          fi
